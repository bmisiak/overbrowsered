name: Release macOS

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}

    steps:
      - name: Validate version tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must look like v1.5.0; got $tag" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  direct:
    name: Sign and notarize direct download
    needs: metadata
    runs-on: macos-26
    environment: release
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID ASC_ISSUER_ID ASC_KEY_ID DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD ASC_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "The release environment is missing $name" >&2
              exit 1
            fi
          done

      - name: Install Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/overbrowsered-release.keychain-db"
          password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$DEVELOPER_ID_P12" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

          if ! security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application'; then
            echo 'The supplied PKCS#12 does not contain a Developer ID Application identity.' >&2
            exit 1
          fi

      - name: Archive
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD: ${{ needs.metadata.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Overbrowsered.xcodeproj \
            -scheme Overbrowsered \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Overbrowsered-DeveloperID.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application'

      - name: Export Developer ID app
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions-DeveloperID.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>developer-id</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Overbrowsered-DeveloperID.xcarchive" \
            -exportPath "$RUNNER_TEMP/direct-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-DeveloperID.plist"

      - name: Notarize and verify
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/direct-export/Overbrowsered.app"
          submission="$RUNNER_TEMP/Overbrowsered-notarization.zip"
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          output="$RUNNER_TEMP/release/Overbrowsered-$VERSION-macOS.zip"

          test -d "$app"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ditto -c -k --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$key" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"

          mkdir -p "$(dirname "$output")"
          ditto -c -k --keepParent "$app" "$output"
          (
            cd "$(dirname "$output")"
            shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256"
          )

      - name: Upload notarized app
        uses: actions/upload-artifact@v7
        with:
          name: overbrowsered-macos-direct
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/overbrowsered-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

  app-store:
    name: Upload Mac App Store build
    needs: metadata
    runs-on: macos-26
    environment: release
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      APP_STORE_APPLICATION_P12: ${{ secrets.APP_STORE_APPLICATION_P12 }}
      APP_STORE_APPLICATION_P12_PASSWORD: ${{ secrets.APP_STORE_APPLICATION_P12_PASSWORD }}
      APP_STORE_INSTALLER_P12: ${{ secrets.APP_STORE_INSTALLER_P12 }}
      APP_STORE_INSTALLER_P12_PASSWORD: ${{ secrets.APP_STORE_INSTALLER_P12_PASSWORD }}
      APP_STORE_PROVISIONING_PROFILE: ${{ secrets.APP_STORE_PROVISIONING_PROFILE }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID MACOS_BUNDLE_ID ASC_ISSUER_ID ASC_KEY_ID APP_STORE_APPLICATION_P12 APP_STORE_APPLICATION_P12_PASSWORD APP_STORE_INSTALLER_P12 APP_STORE_INSTALLER_P12_PASSWORD APP_STORE_PROVISIONING_PROFILE ASC_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "The release environment is missing $name" >&2
              exit 1
            fi
          done

      - name: Install App Store signing material
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/overbrowsered-release.keychain-db"
          password="$(openssl rand -hex 32)"
          application_certificate="$RUNNER_TEMP/app-store-application.p12"
          installer_certificate="$RUNNER_TEMP/app-store-installer.p12"
          profile="$RUNNER_TEMP/Overbrowsered.provisionprofile"

          printf '%s' "$APP_STORE_APPLICATION_P12" | base64 -D > "$application_certificate"
          printf '%s' "$APP_STORE_INSTALLER_P12" | base64 -D > "$installer_certificate"
          printf '%s' "$APP_STORE_PROVISIONING_PROFILE" | base64 -D > "$profile"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$application_certificate" -k "$keychain" -P "$APP_STORE_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$installer_certificate" -k "$keychain" -P "$APP_STORE_INSTALLER_P12_PASSWORD" \
            -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/profile.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          if [[ "$profile_app_id" != "$APPLE_TEAM_ID.$MACOS_BUNDLE_ID" ]]; then
            echo "Provisioning profile is for $profile_app_id, not $APPLE_TEAM_ID.$MACOS_BUNDLE_ID" >&2
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.provisionprofile"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.provisionprofile"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"

      - name: Archive for the Mac App Store
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD: ${{ needs.metadata.outputs.build }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Overbrowsered.xcodeproj \
            -scheme Overbrowsered \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Overbrowsered-AppStore.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Mac App Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Upload to App Store Connect
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          chmod 600 "$key"

          cat > "$RUNNER_TEMP/ExportOptions-AppStore.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>upload</string>
            <key>installerSigningCertificate</key><string>Mac Installer Distribution</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$MACOS_BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>signingCertificate</key><string>Mac App Distribution</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Overbrowsered-AppStore.xcarchive" \
            -exportPath "$RUNNER_TEMP/app-store-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-AppStore.plist" \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/overbrowsered-release.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/app-store-application.p12" \
            "$RUNNER_TEMP/app-store-installer.p12" \
            "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            "$RUNNER_TEMP/Overbrowsered.provisionprofile"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.provisionprofile"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.provisionprofile"

  github-release:
    name: Create draft GitHub release
    needs: [metadata, direct, app-store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Download notarized app
        uses: actions/download-artifact@v7
        with:
          name: overbrowsered-macos-direct
          path: release-assets

      - name: Create or update draft release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f -print)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --draft \
              --title "Overbrowsered $VERSION" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Overbrowsered $VERSION" \
              --repo "$GITHUB_REPOSITORY"
          fi
