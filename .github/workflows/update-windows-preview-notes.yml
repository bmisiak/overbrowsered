name: Update Windows preview release notes

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-windows-preview-notes.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          This is the first public Windows preview of Overbrowsered.

          **These Windows files are unsigned.** Windows SmartScreen may warn before running the portable executables.

          - Choose **x64** for ordinary Intel/AMD Windows PCs.
          - Choose **ARM64** for Windows on Arm.
          - Move the executable to a stable folder before first launch. Overbrowsered registers its current path with Windows.
          - The MSIX bundle uses the Microsoft Store package identity and is not intended for ordinary sideload installation.
          - The Microsoft Store submission is undergoing certification.

          Overbrowsered runs locally, has no accounts or telemetry, and does not silently change the user's default browser.

          Built by GitHub Actions from the tagged source.
          EOF
          gh release edit windows-v0.1.0-preview \
            --repo '${{ github.repository }}' \
            --title 'Overbrowsered for Windows 0.1.0 preview' \
            --notes-file release-notes.md \
            --prerelease
